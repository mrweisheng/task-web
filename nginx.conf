server {
    listen 80;
    server_name 104.37.187.30;

    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源路径处理
    location /assets/ {
        alias /var/www/whatsapp-manager/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # task-web 部分 - 移到前面提高优先级
    location /task-web/ {
        alias /var/www/task-web/dist/;
        index index.html;
        try_files $uri $uri/ /task-web/index.html;
    }

    # /wsmanager/ 路由处理
    location /wsmanager/ {
        alias /var/www/whatsapp-manager/dist/;
        index index.html;
        try_files $uri /wsmanager/index.html;
    }

    location /usermanager/ {
        alias /var/www/admin-manage/dist/;  # 指向你拷贝文件的目标目录
        index index.html;
        try_files $uri $uri/ /usermanager/index.html;
    }

    # 根路径处理，直接加载静态文件，而不是重定向
    location / {
        root /var/www/whatsapp-manager/dist;
        index index.html;
        try_files $uri /index.html;
    }

    # API 反向代理 (现有配置)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # taskapi 路由反向代理配置
    location /taskapi/ {
        proxy_pass http://localhost:5000;  # 确保该服务正确运行
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
} 